# SPDX-License-Identifier: MPL-2.0
# The workspace: the plugin itself, the manifest reader, a contract-test host
# and the build tool. Only `plugin/` ends up inside the package Syrinx loads.

[workspace]
resolver = "3"
members = ["plugin", "format", "test-host", "xtask"]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
publish = false
rust-version = "1.97"

# Every version is pinned exactly with `=`; each is audited in
# docs/dependency-audit.md, and moving one is a reviewed change.
[workspace.dependencies]
plugin-format = { path = "format" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "std"] }
wasmtime = { version = "=48.0.7", default-features = false, features = ["runtime", "cranelift", "component-model", "std", "parallel-compilation", "anyhow"] }
wasmtime-wasi = { version = "=48.0.7", default-features = false, features = ["p2"] }
wit-bindgen = { version = "=0.63.0", default-features = false, features = ["macros"] }

[workspace.lints.rust]
# Hand-written code has no `unsafe`; the only exception is the generated
# WIT glue, whose module says so where it is declared.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# The plugin is built small and reproducibly: one codegen unit, no debug
# information and symbols stripped, so two clean builds give the same bytes.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = false
strip = true
panic = "abort"
incremental = false
