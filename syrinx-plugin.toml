# SPDX-License-Identifier: MPL-2.0
#
# What Syrinx needs to know about this plugin before running any of its code.
# Syrinx reads this file to list the plugin's commands in the palette, to show
# the owner what the plugin asks for, and to refuse anything undeclared. It
# never runs the plugin to find these facts out. See README.md, "The manifest".

schema = 1                           # version of this manifest format

[plugin]
id = "hello"                         # stable; lowercase letters, digits, hyphens; unique
name = "Hello"
version = "0.1.0"                    # SemVer; must equal the release tag (v0.1.0)
description = "A minimal Syrinx plugin: one command, one form and one tab view."
authors = ["Example Author <author@example.invalid>"]
repository = "https://example.invalid/syrinx-plugin-hello"
licence = "MPL-2.0"
min-syrinx = "0.9.0"                 # oldest Syrinx it runs on

[interface]
world = "syrinx:plugin/plugin@0.1.0" # must match the component's interface names

[entry]
module = "plugin.wasm"               # a component built for wasm32-wasip2; never precompiled
ui = "ui/"                           # served only into this plugin's own view
activation = ["on-command", "on-view"]   # start lazily, on first use

# The one command. `form = true` means choosing it in the palette shows the
# declarative form the plugin describes in `forms.form-for`.
[[contributes.commands]]
id = "hello.greet"                   # must start with the plugin id
title = "Say hello"
keywords = ["greet", "example"]
form = true

# The one tab view. The host relays only these methods from the view's
# HTML and JavaScript to the plugin; anything else is refused unread.
[[contributes.tab-types]]
id = "hello.greetings"
title = "Greetings"
ui-methods = ["list-greetings", "clear-greetings"]

# Capabilities. This plugin asks for none, so the owner is asked to grant
# nothing. Every request names a kind, says whether the plugin works without
# it, and gives the one-sentence reason the owner reads before granting it.
# To let the plugin remember the last name it greeted (it tries, and copes
# with the refusal), uncomment this request:
#
# [[capabilities]]
# kind = "storage"                   # this plugin's own namespaced settings
# reason = "Remember the last name you greeted."
# required = false                   # optional: asked for at first use, can be refused
