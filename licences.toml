# SPDX-License-Identifier: MPL-2.0
#
# The licence policy `cargo xtask licences` enforces on every crate in Cargo.lock.
# It follows Syrinx's rule (AGENTS.md, "Dependencies and licence"): permissive
# licences or whole MPL-2.0 files, and no GPL. A crate that offers a choice
# ("MIT OR Apache-2.0") passes when one choice is allowed; we elect that one.
# Anything else is listed below by exact name and version with the owner
# approval that covers it; a new version or a new crate fails until reviewed.
# docs/dependency-audit.md records the audit behind each entry.

allowed = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "MPL-2.0"]

# The wasmtime and Cranelift family, Apache-2.0 WITH LLVM-exception
# (owner approval of note 10, decision 2, 2026-10-21). The exception only
# adds permissions to Apache-2.0. Used by the contract-test host only;
# nothing here is compiled into plugin.wasm.

