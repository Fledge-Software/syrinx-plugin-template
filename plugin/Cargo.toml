[package]
name = "hello-plugin"
version = "0.1.0"
description = "The template's minimal Syrinx plugin: one command, one form and one tab view."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
# `cdylib` is what becomes plugin.wasm; `rlib` lets the unit tests link it.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
wit-bindgen.workspace = true

[lints]
workspace = true
